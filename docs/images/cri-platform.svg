<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="plat-title plat-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="plat-title">Give every character a point of view: the CRI Engine, your game engine, your language model and CRI Studio</title>
<desc id="plat-desc">The CRI Engine, the heart of CRI, holds each character&#x27;s memory (experiences carried across saves), beliefs (their own view of the world) and relationships (their history with others): game events in, character responses out. It works with your game engine (Unity, Unreal Engine, Godot or your own engine) through world adapters, and optionally with your language model (Claude, GPT, Gemini or open-weight models): models give them words, CRI keeps their history. CRI Studio, in development, lets you author, inspect and test characters.</desc>
