<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="loop-title loop-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="loop-title">A life has a causal history: the causal trace of one individual</title>
<desc id="loop-desc">One individual, Astra, at the centre of a loop of eight stages, recorded when she decided rather than told after the fact. Observed: the path flooded. Believed: storms flood the path. Appraised: Quill could get hurt. Wanted: keep Quill safe. Chose: warn Quill. Acted: ran to find Quill. Discovered: the path stayed dry. Revised: not every storm floods. A dashed return arrow from revised back to observed shows that revision changes what comes next.</desc>
