<circle cx="610" cy="980" r="8" fill="#2DD4BF"/>
<text x="630" y="987" font-size="20" font-weight="700" fill="#8CEBDD" letter-spacing="1.5">LATER ENCOUNTER</text>
<text x="602" y="1030" font-size="28" font-weight="700" fill="#EEF7FF">“The path has changed.”</text>
<text x="602" y="1064" font-size="24" fill="#A8BAC9">Finds the aftermath. Revises.</text>
