<text x="140" y="987" font-size="20" font-weight="700" fill="#8FCBFA" letter-spacing="1.5">DIRECT EVIDENCE</text>
<text x="112" y="1030" font-size="28" font-weight="700" fill="#EEF7FF">“I saw the storm hit.”</text>
<text x="112" y="1064" font-size="24" fill="#A8BAC9">Remembers it, and acts on it.</text>
