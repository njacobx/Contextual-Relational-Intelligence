<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="pov-title pov-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="pov-title">One world. Many points of view.</title>
<desc id="pov-desc">A storm reaches the colony. The event is shared; the evidence is not. Astra sees it happen, so she holds direct evidence: she remembers it and acts on it. Quill arrives afterwards, finds the aftermath and revises what she expected. Fenn has no route to the event and holds no belief about it: the world knows, Fenn does not.</desc>
