<circle cx="1100" cy="980" r="8" fill="#A9B4C0"/>
<text x="1120" y="987" font-size="20" font-weight="700" fill="#A9B4C0" letter-spacing="1.5">NO ROUTE</text>
<text x="1092" y="1030" font-size="28" font-weight="700" fill="#EEF7FF">No belief about it.</text>
<text x="1092" y="1064" font-size="24" fill="#A8BAC9">The world knows. Fenn does not.</text>
