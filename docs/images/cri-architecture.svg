<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1262" viewBox="0 0 1600 1262" role="img" aria-labelledby="arch-title arch-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="arch-title">How CRI fits into your game: game events in, character responses out</title>
<desc id="arch-desc">The game knows what happened; CRI keeps what each character knows. Your game or engine (Unity, Unreal Engine, Godot or your own, alongside your behaviour trees, state machines or GOAP) sends events in, through world adapters, to the CRI Engine, a native C++ core. For each character the engine records what it saw, what it remembered, what it believed and how it responded, from its own character state: memory, belief, expectation, relationship and history. Behaviour goes back out to the game with its reasons. An optional language model gives characters their words but never owns their memory or identity. CRI Trace records evidence, state, intent, action, outcome and revision when it happened.</desc>
