<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="cont-title cont-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cont-title">The conversation ends. The character continues.</title>
<desc id="cont-desc">Model context and character state, working together. In a prompt and context layer, history arrives as context, one interaction at a time: three conversations, each separate, each ending. CRI character state is one continuous line beneath them, kept, revised and traced across saves, gathering memories between conversations; each conversation draws on the same history. Built for real games: each character sees only part of the world, memory has to survive a save, every relationship has two sides, and updates share the game’s frame budget.</desc>
