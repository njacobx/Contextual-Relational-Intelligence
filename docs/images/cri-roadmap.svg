<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1478" viewBox="0 0 1600 1478" role="img" aria-labelledby="road-title road-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="road-title">The road to CRI 1.0, and beyond: the CRI roadmap</title>
<desc id="road-desc">Seven stages on one path, with no dates yet. You are here: stage 1. 1, Foundation (now): completing CRI inside Luminids, all seven areas from belief to culture, playable in the game; the native C++ core, and lives that survive saves. 2, Portable Engine (next): the engine-neutral core and ABI, a versioned API, packs for your own characters, and saved lives that restore anywhere. 3, CRI 1.0 (next), the first public release: open source under Apache-2.0, the Engine and SDK, first-class for Godot (2D and 3D), Unity, Unreal and web/TypeScript, with samples, docs, a stable API and migration support; contributions open with a Contributor License Agreement. 4, Models and self-hosting (after 1.0): optional language models, bringing a model to a character or giving an app a CRI mind, and a self-hosted API with privacy and erasure. 5, Beyond games (after 1.0): simulation and digital twins, companions and assistants, and research. 6, Services and support (later): integration, maintenance and support on the same free core. 7, Managed service (later): only when customers need it.</desc>
