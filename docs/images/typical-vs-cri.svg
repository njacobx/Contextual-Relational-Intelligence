<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="cmp-title cmp-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cmp-title">The difference is underneath the dialogue: the common pattern and CRI</title>
<desc id="cmp-desc">Two characters say the same line, “I’ll stay in tonight.” In the common pattern, underneath the line there is only one prompt or behaviour system and whatever context the game supplies: no memory, belief or relationship of its own, rebuilt for each reply, nothing to trace. With CRI, underneath the same line is the character’s own state: a memory that the last storm flooded the path, a belief that storms here flood the path, trust in Quill, who warned her, and an expectation that tonight’s storm will flood it too. Only what reached her, kept and traced. Two architectural patterns, not products.</desc>
